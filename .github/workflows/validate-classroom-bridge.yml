name: Validate Classroom Bridge

on:
  push:
    paths:
      - "classroom-bridge/**"
      - ".github/workflows/validate-classroom-bridge.yml"
  pull_request:
    paths:
      - "classroom-bridge/**"
      - ".github/workflows/validate-classroom-bridge.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: classroom-bridge/requirements.txt

      - name: Install dependencies
        run: python -m pip install --requirement classroom-bridge/requirements.txt

      - name: Compile Python files
        run: python -m compileall -q classroom-bridge

      - name: Run unit tests
        env:
          PYTHONPATH: classroom-bridge
        run: python -m unittest discover -s classroom-bridge/tests -v
