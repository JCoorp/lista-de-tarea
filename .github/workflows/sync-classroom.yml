name: Sync Google Classroom

on:
  workflow_dispatch:
  schedule:
    - cron: "17,47 * * * *"
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write

concurrency:
  group: classroom-sync
  cancel-in-progress: false

jobs:
  sync:
    if: github.event_name != 'issues' || (startsWith(github.event.issue.title, '[classroom-refresh]') && github.actor == github.repository_owner)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: classroom-bridge/requirements.txt

      - name: Install dependencies
        run: python -m pip install --requirement classroom-bridge/requirements.txt

      - name: Sync Classroom to private Google Drive
        env:
          GOOGLE_TOKEN_JSON_B64: ${{ secrets.GOOGLE_TOKEN_JSON_B64 }}
        run: python classroom-bridge/classroom_bridge.py

      - name: Close refresh request
        if: always() && github.event_name == 'issues'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          JOB_STATUS: ${{ job.status }}
        run: |
          if [ "$JOB_STATUS" = "success" ]; then
            gh issue comment "$ISSUE_NUMBER" --body "Sincronización terminada. Los datos se guardaron de forma privada en Google Drive."
          else
            gh issue comment "$ISSUE_NUMBER" --body "La sincronización falló. Revisa el registro de GitHub Actions y la vigencia del secreto OAuth."
          fi
          gh issue close "$ISSUE_NUMBER" --reason completed
